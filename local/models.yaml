# Model registry. NVIDIA-hosted models are the default; other providers are optional.
#
# `${VAR:-default}` is expanded from the environment (local/.env).
#
# NVIDIA endpoints, any of:
#   - NIM on a Brev instance:   NIM_BASE_URL=https://<your-brev-secure-link>/v1   (or http://localhost:8000/v1 via `brev port-forward`)
#   - build.nvidia.com hosted:  NIM_BASE_URL=https://integrate.api.nvidia.com/v1  + NIM_API_KEY=nvapi-...
#   - NIM on your local network: NIM_BASE_URL=http://<host>:8000/v1
#
# The model ids below are examples: set `id` to exactly what your endpoint serves
# (curl $NIM_BASE_URL/models). A model id the registry doesn't know is still accepted and uses the
# default provider with default settings.

providers:
  nvidia:
    type: openai_compat
    default: true
    base_url: ${NIM_BASE_URL:-https://integrate.api.nvidia.com/v1}
    api_key_env: NIM_API_KEY
    api_key_required: false      # self-hosted NIM usually needs no key; build.nvidia.com does
    timeout_s: 900

  # Multimodal embedding model on Brev (instance military-tan-rook, vLLM, Qwen3-VL-Embedding-8B).
  # Reach it with:  brev port-forward military-tan-rook -p 8011:8001   (keep that running; local port 8011 because
  # 8001 is commonly taken by other local dev servers)
  brev_embed:
    type: openai_compat
    base_url: ${EMBED_BASE_URL:-http://localhost:8011/v1}
    api_key_env: EMBED_API_KEY
    api_key_required: false
    timeout_s: 300

  # Omni-Embed-Nemotron-3B (text, image, audio, video -> 2048-d) on Brev (instance omni-embed). Custom HTTP API,
  # not OpenAI-compatible (POST /embed). Reach it with:  brev port-forward omni-embed -p 8002:8002
  brev_omni:
    type: omni_embed
    base_url: ${OMNI_EMBED_BASE_URL:-http://localhost:8002}
    timeout_s: 300

  # Any other OpenAI-compatible server (vLLM, Ollama, OpenAI ...). Enabled when OPENAI_COMPAT_BASE_URL is set.
  custom:
    type: openai_compat
    base_url: ${OPENAI_COMPAT_BASE_URL:-}
    api_key_env: OPENAI_COMPAT_API_KEY
    api_key_required: false

models:
  # --- embeddings -----------------------------------------------------------
  # Verified against the live endpoint: text, image and whole-video input all work via POST /v1/embeddings
  # with chat-style `messages` (content part type text | image_url | video_url as base64 data URL).
  # The server allows ONE image or ONE video per request and a context of 8192 tokens; a 25 s 640x360
  # clip used ~3.7k tokens, so keep clips to roughly 30-45 s.
  - id: ${EMBED_MODEL:-Qwen/Qwen3-VL-Embedding-8B}
    name: Qwen3-VL Embedding 8B (Brev)
    provider: brev_embed
    task: embedding
    dims: 4096
    max_clip_seconds: 30
    segment_fps: 2               # fallbacks used when a task doesn't set them (see `parameters`)
    segment_max_side: 480
    concurrency: 2               # the vLLM server runs --max-num-seqs 2
    pricing: null
    # What the user can set per task (rendered by the UI, validated by the backend). Keys are stored on the
    # task's Request. type: number (min/max) | select (options) | boolean | multiselect (options: [{value,label}]). Frame rate and resolution decide
    # the token cost of each segment (context limit 8192).
    parameters:
      - {key: DurationS, label: Segment Duration, type: number, unit: s, min: 2, max: 30, default: 5}
      - key: Inputs
        label: Inputs
        type: multiselect          # what goes into each segment's vector (maps to the model's input fields)
        options:
          - {value: video, label: Video}
        default: [video]           # this model takes no audio, and one video per request
      - {key: SegmentFps, label: Frame Rate, type: select, unit: fps, options: [1, 2, 4], default: 2}
      - {key: SegmentMaxSide, label: Max Resolution, type: select, unit: px, options: [320, 480, 720], default: 480}
      - key: EmbeddingDim
        label: Dimension
        type: select               # the sizes the SERVER supports; the app asks for the size and stores what comes back
        options: [4096]
        default: 4096              # the native size
        hint: >-
          Only 4096 is offered because the Qwen3-VL-Embedding model card's smaller sizes (64-4096, Matryoshka) are not
          enabled on this server: it rejects a `dimensions` request with "does not support matryoshka representation".
          The app never cuts vectors itself. To offer more sizes, relaunch vLLM with Matryoshka support enabled (typically
          `--hf-overrides '{"is_matryoshka": true}'`, not tested here), then add the sizes to `options` above.

  # Verified against the live endpoint: text, video, audio and video+audio inputs; segments up to 60 s worked
  # (10 s ~0.5 s, 60 s ~3.5 s). The server samples video at 2 fps and caps each frame's pixels itself, so there is
  # no frame-rate / resolution setting; audio is optional and pooled with the video into ONE vector.
  - id: ${OMNI_EMBED_MODEL:-nvidia/omni-embed-nemotron-3b}
    name: Omni-Embed-Nemotron 3B (Brev)
    provider: brev_omni
    task: embedding
    dims: 2048
    max_clip_seconds: 60
    segment_fps: 2               # only used when cutting the segment file; the server resamples itself
    segment_max_side: 480
    concurrency: 2               # the server runs one forward pass at a time; 2 keeps it fed while ffmpeg works
    pricing: null
    parameters:
      - {key: DurationS, label: Segment Duration, type: number, unit: s, min: 2, max: 60, default: 5}
      - key: Inputs
        label: Inputs
        type: multiselect          # the fields of the /embed request: each ticked input is sent for every segment
        options:
          - {value: video, label: Video}
          - {value: audio, label: Audio}
          - {value: image, label: Image (keyframe)}
          - {value: text, label: Text, disabled: true, hint: needs a transcript or caption source, which this app does not have yet}
        default: [video]           # video only unless the user opts in to more
      - key: Combine
        label: Combine inputs into one vector
        type: boolean              # off = one vector per ticked input; on = the server pools them into ONE vector
        default: true
        showIf: {key: Inputs, minSelected: 2}
      - key: EmbeddingDim
        label: Dimension
        type: select               # the sizes the SERVER supports; the app asks for the size and stores what comes back
        options: [2048]
        default: 2048              # the only size
        hint: >-
          Fixed at 2048: the Omni-Embed-Nemotron model card lists a single output size and the server has no dimensions
          option. The app never cuts vectors itself.

  # --- video understanding --------------------------------------------------
  # Model ids below come from NVIDIA's docs/catalog pages and are NOT verified against a live endpoint.
  # Run:  curl -s $NIM_BASE_URL/models -H "Authorization: Bearer $NIM_API_KEY"   to see what you can call.
  - id: ${NIM_VIDEO_MODEL:-nvidia/nemotron-nano-12b-v2-vl}
    name: Nemotron Nano 12B v2 VL (NVIDIA)
    provider: nvidia
    task: video_understanding
    video_input: frames          # frames: sampled JPEGs with timestamps | video_url: whole clip as base64 data URL
    max_frames: 24
    frame_max_side: 768
    max_tokens: 4096
    pricing: null                # self-hosted: no per-token cost. Or: {inputTokensPer1M: 0.5, outputTokensPer1M: 1.5, unit: USD}

  - id: ${NIM_VLM_MODEL:-meta/llama-3.2-11b-vision-instruct}
    name: Llama 3.2 11B Vision (NVIDIA-hosted)
    provider: nvidia
    task: video_understanding
    video_input: frames
    max_frames: 8                # image-only VLM with a small image budget
    frame_max_side: 768
    max_tokens: 2048
    pricing: null

  # Self-hosted on Brev (container from NGC): set NIM_VIDEO_MODEL / add an entry with the id your NIM serves,
  # e.g. a Cosmos Reason 2 NIM. Cosmos Reason 1 7B's hosted API was announced as deprecated on 2026-03-24.
